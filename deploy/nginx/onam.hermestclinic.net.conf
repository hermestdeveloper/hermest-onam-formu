server {
    listen 80;
    listen [::]:80;
    server_name onam.hermestclinic.net;

    # Site Cloudflare proxy'si (turuncu bulut) arkasinda. Bu snippet olmadan
    # nginx her istegi Cloudflare IP'sinden geliyor sanir; giristeki hatali
    # deneme limiti tum kullanicilar icin ortak sayaca doner.
    # Snippet sunucuda uretiliyor: cloudflare.com/ips-v4 + ips-v6 ->
    # set_real_ip_from ... ; real_ip_header CF-Connecting-IP;
    include /etc/nginx/snippets/cloudflare-realip.conf;

    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # $remote_addr, $proxy_add_x_forwarded_for degil: ikincisi istemcinin
        # gonderdigi X-Forwarded-For'u zincire ekliyordu, sahte bir baslikla
        # giris deneme limiti atlanabiliyordu.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
